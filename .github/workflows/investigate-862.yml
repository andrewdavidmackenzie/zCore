name: investigate-862

# Diagnostic workflow for issue #862: macOS-aarch64 test binaries
# SIGTRAP intermittently. Heap corruption (malloc freelist, brk 1).
# Phase 8: vmmap the test process before MockMemory::new's fixed mmap
# to identify EXACTLY what occupies the PMEM window.
on:
  push:
    branches: [core_tests_flaky_862]
  workflow_dispatch:

jobs:
  macos-sigtrap-investigation:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19

      - uses: Swatinem/rust-cache@v2
        with:
          key: investigate-862

      - name: Build test binaries
        working-directory: zCore
        run: |
          cargo test -p zircon-object --features libos,aspace-separate --lib --no-run --message-format=json 2>/dev/null | \
            python3 -c "import sys,json; [print(json.loads(l).get('executable') or '') for l in sys.stdin if '\"executable\"' in l]" | grep -v '^$' > /tmp/testbins.txt
          cat /tmp/testbins.txt

      - name: vmmap the PMEM window before MockMemory::new
        run: |
          BIN=$(head -1 /tmp/testbins.txt)
          for round in 1 2 3; do
            echo "=== vmmap round $round ==="
            ZCORE_PMEM_PROBE=1 ZCORE_PMEM_SLEEP=1 "$BIN" --test-threads=1 --nocapture state_vmo_created > /tmp/vmmap-run.txt 2>&1 &
            PID=$!
            sleep 4
            vmmap "$PID" > /tmp/vmmap.txt 2>&1 || echo "vmmap failed: $(head -3 /tmp/vmmap.txt)"
            echo "--- regions in/near the PMEM window [0x800000000,0x840000000) ---"
            grep -E "00000008[0-3]" /tmp/vmmap.txt | head -15 || echo "(no region lines matched)"
            echo "--- vmmap summary ---"
            grep -E "MALLOC|Stack|__DATA|__TEXT|VM_ALLOCATE|mapped file|Framework|dylib" /tmp/vmmap.txt | head -10
            wait $PID || true
            echo "--- probe said: ---"
            grep "pmem-probe" /tmp/vmmap-run.txt | head -2
          done
