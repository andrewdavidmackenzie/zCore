name: investigate-862

# Diagnostic workflow for issue #862: macOS-aarch64 test binaries
# SIGTRAP intermittently. Heap corruption (malloc freelist, brk 1).
# Phase 4: full suite single-threaded under contention (original crash
# conditions) + guard-malloc to catch the corrupting WRITE in the act.
on:
  push:
    branches: [core_tests_flaky_862]
  workflow_dispatch:

jobs:
  macos-sigtrap-investigation:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19

      - uses: Swatinem/rust-cache@v2
        with:
          key: investigate-862

      - name: Build test binaries
        working-directory: zCore
        run: |
          cargo test -p zircon-object --features libos,aspace-separate --lib --no-run --message-format=json 2>/dev/null | \
            python3 -c "import sys,json; [print(json.loads(l).get('executable') or '') for l in sys.stdin if '\"executable\"' in l]" | grep -v '^$' > /tmp/testbins.txt
          cat /tmp/testbins.txt

      - name: A) Full suite, single-threaded, contention (original conditions)
        run: |
          mkdir -p /tmp/crashes
          BIN=$(head -1 /tmp/testbins.txt)
          for i in 1 2 3 4 5 6; do (while :; do :; done) & echo $! >> /tmp/burners.pid; done
          total=0; trapped=0
          for round in $(seq 1 30); do
            total=$((total+1))
            rc=0; "$BIN" --test-threads=1 > /tmp/st-out.txt 2>&1 || rc=$?
            if [ $rc -ne 0 ]; then
              trapped=$((trapped+1))
              echo "=== ST TRAP round=$round rc=$rc ==="
              grep -E "test .* \.\.\. " /tmp/st-out.txt | tail -3
              sleep 2
              report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
              [ -n "$report" ] && cp "$report" "/tmp/crashes/st-round${round}.ips" || true
            fi
          done
          echo "=== ST RESULT: $trapped trapped of $total ==="

      - name: B) Guard-malloc — catch the corrupting write
        run: |
          BIN=$(head -1 /tmp/testbins.txt)
          total=0; trapped=0
          for round in $(seq 1 12); do
            total=$((total+1))
            rc=0; DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib "$BIN" > /tmp/gm-out.txt 2>&1 || rc=$?
            if [ $rc -ne 0 ]; then
              trapped=$((trapped+1))
              echo "=== GUARD-MALLOC CAUGHT round=$round rc=$rc ==="
              tail -12 /tmp/gm-out.txt
              sleep 2
              report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
              [ -n "$report" ] && cp "$report" "/tmp/crashes/gmalloc-round${round}.ips" || true
              break
            fi
          done
          echo "=== GUARD-MALLOC RESULT: $trapped trapped of $total ==="

      - name: Cleanup burners
        if: always()
        run: |
          [ -f /tmp/burners.pid ] && kill $(cat /tmp/burners.pid) 2>/dev/null || true
          ls -la /tmp/crashes/ || true

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-reports
          path: /tmp/crashes/
          if-no-files-found: ignore
