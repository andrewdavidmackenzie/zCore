name: investigate-862

# Diagnostic workflow for issue #862: macOS-aarch64 test binaries
# SIGTRAP intermittently. Heap corruption (malloc freelist, brk 1).
# Phase 9: VALIDATION of the dynamic-PMEM-base fix — same contended
# campaign that trapped 4/30 (pre-fix) and 3/30 (stale-entry fix only).
on:
  push:
    branches: [core_tests_flaky_862]
  workflow_dispatch:

jobs:
  macos-sigtrap-investigation:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19

      - uses: Swatinem/rust-cache@v2
        with:
          key: investigate-862

      - name: Build test binaries
        working-directory: zCore
        run: |
          cargo test -p zircon-object --features libos,aspace-separate --lib --no-run --message-format=json 2>/dev/null | \
            python3 -c "import sys,json; [print(json.loads(l).get('executable') or '') for l in sys.stdin if '\"executable\"' in l]" | grep -v '^$' > /tmp/testbins.txt
          cargo test -p hal-impl --features libos --no-run --message-format=json 2>/dev/null | \
            python3 -c "import sys,json; [print(json.loads(l).get('executable') or '') for l in sys.stdin if '\"executable\"' in l]" | grep -v '^$' >> /tmp/testbins.txt
          cat /tmp/testbins.txt

      - name: Contended campaign (both binaries, both threading modes)
        run: |
          mkdir -p /tmp/crashes
          for i in 1 2 3 4 5 6; do (while :; do :; done) & echo $! >> /tmp/burners.pid; done
          total=0; trapped=0
          for round in $(seq 1 15); do
            while read -r bin; do
              for mode in "" "--test-threads=1"; do
                total=$((total+1))
                name=$(basename "$bin" | cut -d- -f1)
                rc=0; "$bin" $mode > /tmp/run-out.txt 2>&1 || rc=$?
                if [ $rc -ne 0 ]; then
                  trapped=$((trapped+1))
                  echo "=== TRAP round=$round bin=$name mode='$mode' rc=$rc ==="
                  tail -6 /tmp/run-out.txt
                  sleep 2
                  report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
                  [ -n "$report" ] && cp "$report" "/tmp/crashes/fixed-trap-${name}-round${round}.ips" || true
                fi
              done
            done < /tmp/testbins.txt
          done
          echo "=== VALIDATION RESULT: $trapped trapped of $total runs ==="

      - name: Cleanup burners
        if: always()
        run: |
          [ -f /tmp/burners.pid ] && kill $(cat /tmp/burners.pid) 2>/dev/null || true
          ls -la /tmp/crashes/ || true

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-reports
          path: /tmp/crashes/
          if-no-files-found: ignore
