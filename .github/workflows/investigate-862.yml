name: investigate-862

# Diagnostic workflow for issue #862: macOS-aarch64 test binaries
# SIGTRAP intermittently. Heap corruption (malloc freelist, brk 1).
# Phase 6: AddressSanitizer build — catch the corrupting write with a
# report (guard-malloc changed timing: 0/150, ASAN preserves it).
on:
  push:
    branches: [core_tests_flaky_862]
  workflow_dispatch:

jobs:
  macos-sigtrap-investigation:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19

      - uses: Swatinem/rust-cache@v2
        with:
          key: investigate-862

      - name: Build test binary with AddressSanitizer
        working-directory: zCore
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          CARGO_TARGET_DIR: /tmp/asan-target
        run: |
          cargo test -p zircon-object --features libos,aspace-separate --lib --no-run --message-format=json 2>/dev/null | \
            python3 -c "import sys,json; [print(json.loads(l).get('executable') or '') for l in sys.stdin if '\"executable\"' in l]" | grep -v '^$' > /tmp/testbins.txt
          cat /tmp/testbins.txt

      - name: ASAN contended campaign
        run: |
          mkdir -p /tmp/crashes
          BIN=$(head -1 /tmp/testbins.txt)
          for i in 1 2 3 4 5 6; do (while :; do :; done) & echo $! >> /tmp/burners.pid; done
          total=0; caught=0
          for round in $(seq 1 60); do
            total=$((total+1))
            rc=0; ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 "$BIN" > /tmp/asan-out.txt 2>&1 || rc=$?
            if [ $rc -ne 0 ]; then
              caught=$((caught+1))
              echo "=== ASAN CAUGHT round=$round rc=$rc ==="
              head -60 /tmp/asan-out.txt
              sleep 2
              report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
              [ -n "$report" ] && cp "$report" "/tmp/crashes/asan-round${round}.ips" || true
              cp /tmp/asan-out.txt "/tmp/crashes/asan-round${round}.txt" || true
            fi
          done
          echo "=== ASAN RESULT: $caught caught of $total ==="

      - name: Cleanup burners
        if: always()
        run: |
          [ -f /tmp/burners.pid ] && kill $(cat /tmp/burners.pid) 2>/dev/null || true
          ls -la /tmp/crashes/ || true

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-reports
          path: /tmp/crashes/
          if-no-files-found: ignore
