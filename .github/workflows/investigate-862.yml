name: investigate-862

# Diagnostic workflow for issue #862: macOS-aarch64 test binaries
# SIGTRAP intermittently. Heap corruption (malloc freelist, brk 1).
# Phase 7: probe the PMEM MAP_FIXED window for pre-existing mappings
# (the clobber hypothesis) + keep a small ASAN campaign running.
on:
  push:
    branches: [core_tests_flaky_862]
  workflow_dispatch:

jobs:
  macos-sigtrap-investigation:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19

      - uses: Swatinem/rust-cache@v2
        with:
          key: investigate-862

      - name: Build test binaries
        working-directory: zCore
        run: |
          cargo test -p zircon-object --features libos,aspace-separate --lib --no-run --message-format=json 2>/dev/null | \
            python3 -c "import sys,json; [print(json.loads(l).get('executable') or '') for l in sys.stdin if '\"executable\"' in l]" | grep -v '^$' > /tmp/testbins.txt
          cat /tmp/testbins.txt

      - name: PMEM window probe (what does MAP_FIXED clobber?)
        run: |
          BIN=$(head -1 /tmp/testbins.txt)
          for round in $(seq 1 8); do
            echo "=== probe round $round ==="
            rc=0; ZCORE_PMEM_PROBE=1 "$BIN" --test-threads=1 --nocapture > /tmp/probe-out.txt 2>&1 || rc=$?
            grep "pmem-probe" /tmp/probe-out.txt | head -3
          done

      - name: Contended runs with probe (clobber under load)
        run: |
          BIN=$(head -1 /tmp/testbins.txt)
          for i in 1 2 3 4 5 6; do (while :; do :; done) & echo $! >> /tmp/burners.pid; done
          mkdir -p /tmp/crashes
          total=0; trapped=0; clobbered=0
          for round in $(seq 1 30); do
            total=$((total+1))
            rc=0; ZCORE_PMEM_PROBE=1 "$BIN" --test-threads=1 > /tmp/probe-out.txt 2>&1 || rc=$?
            if grep -q "ALREADY has" /tmp/probe-out.txt; then
              clobbered=$((clobbered+1))
              echo "=== CLOBBER round=$round ==="
              grep "pmem-probe" /tmp/probe-out.txt | head -2
            fi
            if [ $rc -ne 0 ]; then
              trapped=$((trapped+1))
              echo "=== TRAP round=$round rc=$rc (clobber in this run: $(grep -c 'ALREADY has' /tmp/probe-out.txt)) ==="
              sleep 2
              report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
              [ -n "$report" ] && cp "$report" "/tmp/crashes/probe-trap-round${round}.ips" || true
            fi
          done
          echo "=== PROBE RESULT: $trapped trapped, $clobbered clobbered, of $total ==="

      - name: Cleanup burners
        if: always()
        run: |
          [ -f /tmp/burners.pid ] && kill $(cat /tmp/burners.pid) 2>/dev/null || true
          ls -la /tmp/crashes/ || true

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-reports
          path: /tmp/crashes/
          if-no-files-found: ignore
