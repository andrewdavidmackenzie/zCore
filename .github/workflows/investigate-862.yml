name: investigate-862

# Diagnostic workflow for issue #862: macOS-aarch64 test binaries
# SIGTRAP intermittently. Heap corruption (malloc freelist, brk 1).
# Phase 5: large guard-malloc campaign to catch the corrupting write.
on:
  push:
    branches: [core_tests_flaky_862]
  workflow_dispatch:

jobs:
  macos-sigtrap-investigation:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19

      - uses: Swatinem/rust-cache@v2
        with:
          key: investigate-862

      - name: Build test binaries
        working-directory: zCore
        run: |
          cargo test -p zircon-object --features libos,aspace-separate --lib --no-run --message-format=json 2>/dev/null | \
            python3 -c "import sys,json; [print(json.loads(l).get('executable') or '') for l in sys.stdin if '\"executable\"' in l]" | grep -v '^$' > /tmp/testbins.txt
          cat /tmp/testbins.txt

      - name: Guard-malloc campaign (parallel + single-thread, contention)
        run: |
          mkdir -p /tmp/crashes
          BIN=$(head -1 /tmp/testbins.txt)
          for i in 1 2 3 4 5 6; do (while :; do :; done) & echo $! >> /tmp/burners.pid; done
          total=0; trapped=0
          for round in $(seq 1 100); do
            total=$((total+1))
            rc=0; DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib "$BIN" > /tmp/gm-out.txt 2>&1 || rc=$?
            if [ $rc -ne 0 ]; then
              trapped=$((trapped+1))
              echo "=== GM-PARALLEL CAUGHT round=$round rc=$rc ==="
              tail -12 /tmp/gm-out.txt
              sleep 2
              report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
              [ -n "$report" ] && cp "$report" "/tmp/crashes/gm-parallel-round${round}.ips" || true
            fi
          done
          echo "=== GM-PARALLEL RESULT: $trapped trapped of $total ==="
          total=0; trapped=0
          for round in $(seq 1 50); do
            total=$((total+1))
            rc=0; DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib "$BIN" --test-threads=1 > /tmp/gm-out.txt 2>&1 || rc=$?
            if [ $rc -ne 0 ]; then
              trapped=$((trapped+1))
              echo "=== GM-ST CAUGHT round=$round rc=$rc ==="
              tail -12 /tmp/gm-out.txt
              sleep 2
              report=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
              [ -n "$report" ] && cp "$report" "/tmp/crashes/gm-st-round${round}.ips" || true
            fi
          done
          echo "=== GM-ST RESULT: $trapped trapped of $total ==="

      - name: Cleanup burners
        if: always()
        run: |
          [ -f /tmp/burners.pid ] && kill $(cat /tmp/burners.pid) 2>/dev/null || true
          ls -la /tmp/crashes/ || true

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-reports
          path: /tmp/crashes/
          if-no-files-found: ignore
