name: Test CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Run unit test
        run: cargo test --no-fail-fast

  boot-smoke-test:
    name: Boot Smoke Test (aarch64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: ignored/origin/repos/busybox
          key: busybox-src-v2

      - name: Cache musl-cross toolchain (macOS)
        if: runner.os == 'macOS'
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/musl-cross
          key: musl-cross-${{ runner.os }}-${{ runner.arch }}-v0.9.11

      - name: Install cross-compilation toolchain (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit != 'true'
        run: make config

      - name: Restore musl-cross symlinks (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: brew link musl-cross 2>/dev/null || brew tap FiloSottile/musl-cross && brew link filosottile/musl-cross/musl-cross 2>/dev/null || true

      - name: Install kernel headers (macOS, cached)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: |
          MUSL_PREFIX=$(brew --prefix musl-cross)/libexec
          for MUSL_ARCH in aarch64 riscv64; do
            SYSROOT="$MUSL_PREFIX/$MUSL_ARCH-linux-musl"
            if [ ! -f "$SYSROOT/include/linux/compiler.h" ]; then
              make config
              break
            fi
          done

      - name: Install cross-compilation toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-utils wget

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Build kernel and rootfs
        run: make build ARCH=aarch64

      - name: Boot smoke test
        run: make boot-test ARCH=aarch64

  boot-smoke-test-x86_64:
    name: Boot Smoke Test (x86_64)
    # Linux only: macOS musl-cross doesn't cache x86_64 yet, and building
    # it from source takes 30+ minutes. Will add macOS once the musl-cross
    # cache is updated to include x86_64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: ignored/origin/repos/busybox
          key: busybox-src-v2

      - name: Install QEMU and tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils wget

      - name: Build kernel and rootfs
        run: make build ARCH=x86_64

      - name: Boot smoke test
        run: make boot-test ARCH=x86_64

  zircon-boot-test:
    name: Zircon Boot Test (aarch64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none-softfloat

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Zircon boot smoke test
        run: make zircon-boot-test ARCH=aarch64

  libc-test:
    name: Libc Test (aarch64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: ignored/origin/repos/busybox
          key: busybox-src-v2

      - name: Cache musl-cross toolchain (macOS)
        if: runner.os == 'macOS'
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/musl-cross
          key: musl-cross-${{ runner.os }}-${{ runner.arch }}-v0.9.11

      - name: Install cross-compilation toolchain (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit != 'true'
        run: make config

      - name: Restore musl-cross symlinks (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: brew link musl-cross 2>/dev/null || brew tap FiloSottile/musl-cross && brew link filosottile/musl-cross/musl-cross 2>/dev/null || true

      - name: Install kernel headers (macOS, cached)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: |
          MUSL_PREFIX=$(brew --prefix musl-cross)/libexec
          for MUSL_ARCH in aarch64 riscv64; do
            SYSROOT="$MUSL_PREFIX/$MUSL_ARCH-linux-musl"
            if [ ! -f "$SYSROOT/include/linux/compiler.h" ]; then
              make config
              break
            fi
          done

      - name: Install cross-compilation toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-utils wget

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Build kernel and rootfs
        run: make build ARCH=aarch64

      - name: Run libc-test
        run: make libc-test ARCH=aarch64
