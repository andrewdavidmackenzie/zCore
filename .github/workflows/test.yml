name: Test CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: unit-test-${{ matrix.os }}

      - name: Run unit test
        run: cargo test --no-fail-fast

      - name: Run zircon-object host tests (libos + aspace-separate)
        run: cargo test -p zircon-object --features libos,aspace-separate --no-fail-fast

      - name: Run Zircon syscall tests (libos)
        run: cargo test -p zircon-tests --no-fail-fast -- --test-threads=1

  boot-smoke-test:
    name: Boot Smoke Test (aarch64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (x86_64) uses TCG for aarch64 guest but needs
        # the x86_64 musl cross-toolchain for busybox. ubuntu-24.04-arm
        # can't use the x86_64 musl binaries. Keep on ubuntu-latest
        # until a native aarch64 musl toolchain is available.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: .build-cache/origin/repos/busybox
          key: busybox-src-v2

      - name: Cache musl-cross toolchain (macOS)
        if: runner.os == 'macOS'
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/musl-cross
          key: musl-cross-${{ runner.os }}-${{ runner.arch }}-v0.9.11

      - name: Install cross-compilation toolchain (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit != 'true'
        run: make config

      - name: Restore musl-cross symlinks (macOS)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: brew link musl-cross 2>/dev/null || brew tap FiloSottile/musl-cross && brew link filosottile/musl-cross/musl-cross 2>/dev/null || true

      - name: Install kernel headers (macOS, cached)
        if: runner.os == 'macOS' && steps.cache-musl.outputs.cache-hit == 'true'
        run: |
          MUSL_PREFIX=$(brew --prefix musl-cross)/libexec
          for MUSL_ARCH in aarch64 riscv64; do
            SYSROOT="$MUSL_PREFIX/$MUSL_ARCH-linux-musl"
            if [ ! -f "$SYSROOT/include/linux/compiler.h" ]; then
              make config
              break
            fi
          done

      - uses: Swatinem/rust-cache@v2
        with:
          key: boot-aarch64-${{ matrix.os }}

      - name: Install cross-compilation toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-utils wget

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Build kernel and rootfs
        run: make build CONFIG=busybox.qemu-aarch64 ARCH=aarch64

      - name: Boot smoke test
        run: make boot-test CONFIG=busybox.qemu-aarch64 ARCH=aarch64

  boot-smoke-test-x86_64:
    name: Boot Smoke Test (x86_64)
    # Linux only: macOS musl-cross doesn't cache x86_64 yet, and building
    # it from source takes 30+ minutes. Will add macOS once the musl-cross
    # cache is updated to include x86_64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: .build-cache/origin/repos/busybox
          key: busybox-src-v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: boot-x86_64

      - name: Install QEMU and tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf qemu-utils wget

      - name: Build kernel and rootfs
        run: make build CONFIG=busybox.qemu-x86_64 ARCH=x86_64

      - name: Boot smoke test
        run: make boot-test CONFIG=busybox.qemu-x86_64 ARCH=x86_64

  boot-smoke-test-riscv64:
    name: Boot Smoke Test (riscv64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: .build-cache/origin/repos/busybox
          key: busybox-src-v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: boot-riscv64

      - name: Install QEMU and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc qemu-utils wget
          # Verify QEMU riscv64 is available (may be in qemu-system-misc or qemu-system-riscv)
          which qemu-system-riscv64 || sudo apt-get install -y qemu-system-riscv || true
          qemu-system-riscv64 --version

      - name: Build kernel and rootfs
        run: make build CONFIG=busybox.qemu-riscv64 ARCH=riscv64

      - name: Boot smoke test
        run: make boot-test CONFIG=busybox.qemu-riscv64 ARCH=riscv64

  zircon-boot-test:
    name: Zircon Boot Test (aarch64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19
          components: rust-src, llvm-tools-preview
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@v2
        with:
          key: zircon-aarch64-${{ matrix.os }}

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Zircon boot smoke test (ZBI mode)
        run: make zircon-boot-test ARCH=aarch64

      - name: Zircon rootfs boot test
        run: tools/scripts/zircon-rootfs-test.sh zircon-hello.qemu-aarch64 aarch64

  zircon-boot-test-x86:
    name: Zircon Boot Test (x86_64)
    # macOS removed: x86_64 guest on ARM macOS = slow TCG emulation.
    # The x86_64 macOS build is validated by build.yml::bare-metal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2
        with:
          key: zircon-x86_64

      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Zircon boot smoke test (x86_64)
        run: make zircon-boot-test ARCH=x86_64

  rust-tests-qemu:
    name: Rust Zircon Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qemu-pkg: qemu-system-arm
          - arch: x86_64
            runner: ubuntu-latest
            qemu-pkg: qemu-system-x86 ovmf
          # riscv64 disabled: LTO strips primary_core_init body, turning
          # it into a panic stub. Needs investigation — see #XXX.
          # - arch: riscv64
          #   runner: ubuntu-latest
          #   qemu-pkg: qemu-system-misc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19
          components: rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-tests-${{ matrix.arch }}-${{ matrix.runner }}

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.qemu-pkg }}

      - name: Build and run Rust zircon-tests (kernel mode)
        run: make rust-tests RUST_TESTS_ARCH=${{ matrix.arch }}

      # TODO: petal vmar_test needs rootfs infrastructure (#817)
      # - name: Run petal vmar_test (user mode)
      #   run: tools/scripts/petal-test.sh ${{ matrix.arch }} vmar_test

  petal-tests-qemu:
    name: Petal User-Mode Tests (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            qemu-pkg: qemu-system-arm
          - arch: x86_64
            qemu-pkg: qemu-system-x86 ovmf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19
          components: rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: petal-tests-${{ matrix.arch }}

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.qemu-pkg }}

      - name: Run petal user-mode test suite (single boot)
        run: tools/scripts/petal-tests.sh ${{ matrix.arch }}

  zircon-core-tests-x86:
    name: Zircon Core Tests (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-19
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2
        with:
          key: core-tests-x86_64

      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf

      - name: Build core-tests
        run: make core-tests-build

      - name: Run core-tests
        run: make core-tests CORE_TESTS_TIMEOUT=3600

  libc-test:
    name: Libc Test (aarch64, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: .build-cache/origin/repos/busybox
          key: busybox-src-v2

      - name: Cache musl-cross toolchain (macOS)
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/musl-cross
          key: musl-cross-${{ runner.os }}-${{ runner.arch }}-v0.9.11

      - name: Install cross-compilation toolchain (macOS)
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: make config

      - name: Restore musl-cross symlinks (macOS)
        if: steps.cache-musl.outputs.cache-hit == 'true'
        run: brew link musl-cross 2>/dev/null || brew tap FiloSottile/musl-cross && brew link filosottile/musl-cross/musl-cross 2>/dev/null || true

      - name: Install kernel headers (macOS, cached)
        if: steps.cache-musl.outputs.cache-hit == 'true'
        run: |
          MUSL_PREFIX=$(brew --prefix musl-cross)/libexec
          for MUSL_ARCH in aarch64; do
            SYSROOT="$MUSL_PREFIX/$MUSL_ARCH-linux-musl"
            if [ ! -f "$SYSROOT/include/linux/compiler.h" ]; then
              make config
              break
            fi
          done

      - uses: Swatinem/rust-cache@v2
        with:
          key: libc-aarch64-macos

      - name: Install QEMU (macOS)
        run: brew install qemu

      - name: Build kernel and rootfs
        run: make build CONFIG=busybox.qemu-aarch64 ARCH=aarch64

      - name: Run libc-test
        run: make libc-test CONFIG=busybox.qemu-aarch64 ARCH=aarch64

  libc-test-ubuntu:
    name: Libc Test (aarch64, ubuntu)
    # Needs x86_64 musl cross-toolchain for busybox — can't use ARM runner yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: .build-cache/origin/repos/busybox
          key: busybox-src-v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: libc-aarch64-ubuntu

      - name: Install QEMU and tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-utils wget

      - name: Build kernel and rootfs
        run: make build CONFIG=busybox.qemu-aarch64 ARCH=aarch64

      - name: Run libc-test
        run: make libc-test CONFIG=busybox.qemu-aarch64 ARCH=aarch64

  libc-test-x86_64:
    name: Libc Test (x86_64)
    # Linux only: macOS musl-cross cache doesn't include x86_64 yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache busybox source
        uses: actions/cache@v4
        with:
          path: .build-cache/origin/repos/busybox
          key: busybox-src-v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: libc-x86_64

      - name: Install QEMU and tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf qemu-utils wget

      - name: Build kernel and rootfs
        run: make build CONFIG=busybox.qemu-x86_64 ARCH=x86_64

      - name: Run libc-test
        run: make libc-test CONFIG=busybox.qemu-x86_64 ARCH=x86_64
