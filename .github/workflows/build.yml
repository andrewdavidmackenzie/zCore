name: Build CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # workspace job removed: cargo fmt + cargo build is a subset of
  # the clippy job which does fmt + clippy (superset of build).

  bare-metal:
    name: Bare-metal ${{ matrix.arch }} (macos-latest)
    # Ubuntu bare-metal builds are covered by boot/zircon tests in test.yml.
    # Keep macOS to validate cross-compilation on a different toolchain.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, clippy

      - name: Cache musl-cross toolchain
        id: cache-musl
        uses: actions/cache@v4
        with:
          path: /opt/homebrew/Cellar/musl-cross
          key: musl-cross-${{ runner.os }}-${{ runner.arch }}-v0.9.11

      - name: Install cross-compilation toolchain
        if: steps.cache-musl.outputs.cache-hit != 'true'
        run: make config

      - name: Restore musl-cross symlinks
        if: steps.cache-musl.outputs.cache-hit == 'true'
        run: brew link musl-cross 2>/dev/null || brew tap FiloSottile/musl-cross && brew link filosottile/musl-cross/musl-cross 2>/dev/null || true

      - name: Install kernel headers (cached)
        if: steps.cache-musl.outputs.cache-hit == 'true'
        run: |
          MUSL_PREFIX=$(brew --prefix musl-cross)/libexec
          for MUSL_ARCH in aarch64 riscv64; do
            SYSROOT="$MUSL_PREFIX/$MUSL_ARCH-linux-musl"
            if [ ! -f "$SYSROOT/include/linux/compiler.h" ]; then
              make config
              break
            fi
          done

      - uses: Swatinem/rust-cache@v2
        with:
          key: bare-metal-${{ matrix.arch }}-macos

      - name: Build ${{ matrix.arch }} bare-metal linux
        run: cargo bin -m qemu-${{ matrix.arch }}

      - name: Build ${{ matrix.arch }} bare-metal (Zircon only)
        if: matrix.arch == 'x86_64'
        run: cargo bin -m qemu-${{ matrix.arch }}

  libos:
    name: LibOS build
    # macOS removed: 3x slower than ubuntu, redundant. See #248.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: libos

      - name: Build libos (Linux mode)
        run: cargo zcore-build -m libos --flavour linux

      - name: Build libos (Zircon mode)
        run: cargo zcore-build -m libos

  clippy:
    name: Clippy (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Clippy all targets and personalities
        run: cargo check-style

  hardware-targets:
    name: Hardware targets (build-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: hardware-targets

      - name: Build raspi400
        run: cargo bin -m raspi400

      - name: Build x86-laptop
        run: cargo bin -m x86-laptop

      - name: Build with Linux emulation (aarch64)
        run: cargo bin -m qemu-aarch64 --flavour linux

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          LATEST=$(curl -sSL https://api.github.com/repos/rust-lang/mdBook/releases/latest | grep tag_name | cut -d'"' -f4)
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${LATEST}/mdbook-${LATEST}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build docs
        run: mdbook build
