[workspace]
members = [
    "drivers",
    "kernel-hal",
    "zCore/zircon-object",
    "zCore/zircon-syscall",
    "zCore/zircon-abi",
    "linux-object",
    "linux-syscall",
    "loader",
    "zCore",
    "z-config",
    "xtask",
    "third-party/executor",
    "third-party/region-alloc",
    # Cross-compiled for bare-metal userspace by xtask.
    # Not in default-members (require explicit --target to build).
    "petal",
    "zCore/userstart",
]
default-members = ["xtask"]
exclude = ["rboot"]
resolver = "2"

[profile.release]
lto = true
debug = true

# Userspace binaries: optimized for size, no debug info
[profile.release.package.petal]
opt-level = "s"
debug = false

[profile.release.package.userstart]
opt-level = "s"
debug = false
