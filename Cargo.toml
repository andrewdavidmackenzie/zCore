[workspace]
members = [
    "drivers",
    "kernel-hal",
    "zCore/zircon-object",
    "zCore/zircon-syscall",
    "zCore/zircon-abi",
    "linux-object",
    "linux-syscall",
    "loader",
    "zCore",
    "z-config",
    "xtask",
    "third-party/executor",
    "third-party/region-alloc",
]
default-members = ["xtask"]
# petal and userstart are cross-compiled for bare-metal targets by xtask,
# not buildable as workspace members (different target arch).
exclude = ["petal", "rboot", "zCore/userstart"]
resolver = "2"

[profile.release]
lto = true
debug = true
