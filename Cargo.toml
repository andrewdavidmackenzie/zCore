[workspace]
members = [
    "zCore/hal",
    "zCore/drivers",
    "zCore/hal-impl",
    "zCore/zircon-object",
    "zCore/zircon-syscall",
    "zCore/zircon-abi",
    "zCore/zircon-loader",
    "zCore/linux-object",
    "zCore/linux-syscall",
    "zCore/linux-loader",
    "zCore/kernel",

    "tools/xtask",
    "zCore/executor",
    "zCore/lock",
    "zCore/vfs/rcore-fs",
    "zCore/vfs/rcore-fs-sfs",
    "zCore/vfs/rcore-fs-ramfs",
    "zCore/vfs/rcore-fs-mountfs",
    "zCore/vfs/rcore-fs-devfs",
    # Cross-compiled for bare-metal userspace by xtask.
    # Not in default-members (require explicit --target to build).
    "zCore/zx",
    "zCore/vdso",
    "petal",
    "zCore/userstart",
]
default-members = ["tools/xtask"]
exclude = ["tools/x86-bootimage"]
resolver = "2"

[profile.release]
lto = true
debug = true

# Userspace binaries: optimized for size, no debug info
[profile.release.package.petal]
opt-level = "s"
debug = false

[profile.release.package.userstart]
opt-level = "s"
debug = false

# Target definitions are in targets/<name>.toml.
# See targets/ directory for available build targets.
