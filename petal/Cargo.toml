[package]
name = "petal"
version = "0.1.0"
edition = "2021"
description = "Minimal userspace test programs for the zCore Zircon kernel"

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[[bin]]
name = "channel-test"
path = "src/bin/channel_test.rs"

[[bin]]
name = "vmo-test"
path = "src/bin/vmo_test.rs"

[[bin]]
name = "vdso-test"
path = "src/bin/vdso_test.rs"

[[bin]]
name = "alloc-test"
path = "src/bin/alloc_test.rs"

[[bin]]
name = "shell"
path = "src/bin/shell.rs"

[[bin]]
name = "process-mem-test"
path = "src/bin/process_mem_test.rs"

[[bin]]
name = "exception-test"
path = "src/bin/exception_test.rs"

[package.metadata.cargo-all-features]
# Userspace binaries require bare-metal targets (aarch64-unknown-none-softfloat, etc.).
skip_package = true

[dependencies]
zx = { path = "../zCore/zx" }
embedded-io = "0.6"

# Profile settings are in the workspace root Cargo.toml
