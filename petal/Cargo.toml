[package]
name = "petal"
version = "0.1.0"
edition = "2021"
description = "Minimal userspace test programs for the zCore Zircon kernel"

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[[bin]]
name = "channel_test"
path = "src/bin/channel_test.rs"

[[bin]]
name = "vmo_test"
path = "src/bin/vmo_test.rs"

[dependencies]
zircon-abi = { path = "../zCore/zircon-abi", features = ["userspace"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
