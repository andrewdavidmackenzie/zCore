[package]
name = "petal"
version = "0.1.0"
edition = "2021"
description = "Minimal userspace test programs for the zCore Zircon kernel"

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[[bin]]
name = "channel-test"
path = "src/bin/channel_test.rs"

[[bin]]
name = "vmo-test"
path = "src/bin/vmo_test.rs"

[[bin]]
name = "vdso-test"
path = "src/bin/vdso_test.rs"

[[bin]]
name = "alloc-test"
path = "src/bin/alloc_test.rs"

[[bin]]
name = "shell"
path = "src/bin/shell.rs"

[[bin]]
name = "process-mem-test"
path = "src/bin/process_mem_test.rs"

[[bin]]
name = "exception-test"
path = "src/bin/exception_test.rs"

[package.metadata.cargo-all-features]
# Userspace binaries require bare-metal targets (aarch64-unknown-none-softfloat, etc.).
skip_package = true

[dependencies]
zx = { path = "../zCore/zx" }
zircon-abi = { path = "../zCore/zircon-abi", default-features = false }
embedded-io = "0.6"

# Profile settings are in the workspace root Cargo.toml

[[bin]]
name = "debuglog-test"
path = "src/bin/debuglog_test.rs"

[[bin]]
name = "counter-test"
path = "src/bin/counter_test.rs"

[[bin]]
name = "hotplug-test"
path = "src/bin/hotplug_test.rs"

[[bin]]
name = "syscall-transfer-data-test"
path = "src/bin/syscall_transfer_data_test.rs"

[[bin]]
name = "syscall-vmo-test"
path = "src/bin/syscall_vmo_test.rs"

[[bin]]
name = "user-exceptions-test"
path = "src/bin/user_exceptions_test.rs"

[[bin]]
name = "clock-test"
path = "src/bin/clock_test.rs"

[[bin]]
name = "bad-access-test"
path = "src/bin/bad_access_test.rs"

[[bin]]
name = "syscall-handle-test"
path = "src/bin/syscall_handle_test.rs"

[[bin]]
name = "syscall-fifo-test"
path = "src/bin/syscall_fifo_test.rs"

[[bin]]
name = "syscall-port-test"
path = "src/bin/syscall_port_test.rs"
