[package]
name = "vdso"
version = "0.1.0"
edition = "2021"
description = "Zircon vDSO: syscall trampolines and system constant accessors"

[package.metadata.cargo-all-features]
# Bare-metal vDSO, built by xtask for specific architectures.
skip_package = true

[dependencies]

[lib]
# Built as a static library; the vDSO ELF is assembled by xtask
# from the generated object code.
crate-type = ["staticlib"]
