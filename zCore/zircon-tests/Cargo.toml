[package]
name = "zircon-tests"
version = "0.1.0"
edition = "2021"
description = "Rust-native Zircon syscall test suite (no_std)"

# Run tests: cargo test -p zircon-tests
# Bare-metal: compiled as a library dependency of the kernel.

[features]
default = ["host"]
# host: enable host-mode HAL backend and separate address spaces.
host = [
    "zircon-object/aspace-separate",
    "hal-impl/libos",
]
# baremetal-test: tests compiled as a library for kernel integration.
baremetal-test = []

[dependencies]
zircon-object = { path = "../zircon-object", default-features = false, features = ["testing", "elf"] }
zircon-syscall = { path = "../zircon-syscall", default-features = false }
hal-impl = { path = "../hal-impl", default-features = false }
lock = { path = "../lock" }
log = "0.4"
executor = { path = "../executor" }
spin = "0.9"
xmas-elf = "0.7"

[dev-dependencies]
async-std = { version = "1.10", features = ["attributes"] }

[package.metadata.cargo-all-features]
skip_package = true
