[package]
name = "zcore-sfs"
version = "0.1.0"
authors = ["WangRunji <wangrunji0408@163.com>"]
edition = "2018"

[dependencies]
zcore-fs = { path = "../zcore-fs" }
static_assertions = "1.1"
spin = "0.9"
log = "0.4"
bitvec = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.2"
# Tests use `Arc<Mutex<File>>` as a block device, whose `Device` impl
# lives behind zcore-fs's `std` feature. Without this the test target
# only compiles inside a workspace-wide build where feature unification
# (via xtask's `zcore-fs/std`) happens to enable it.
zcore-fs = { path = "../zcore-fs", features = ["std"] }
