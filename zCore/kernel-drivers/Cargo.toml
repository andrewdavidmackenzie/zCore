[package]
name = "kernel-drivers"
version = "0.1.0"
edition = "2021"
description = "Boot-essential device drivers for zCore kernel (irq, uart, pci, virtio)"

[features]
virtio = ["virtio-drivers"]
libos = ["async-std"]
no-pci = []

# Special hardware drivers
allwinner = ["d1-pac"]
fu740 = []

[dependencies]
log = "0.4"
cfg-if = "1.0"
bitflags = "1.3"
spin = "0.9"
numeric-enum-macro = "0.2"
device_tree = { git = "https://github.com/rcore-os/device_tree-rs", rev = "2f2e55f" }
bitmap-allocator = "0.4"
pci = { git = "https://github.com/elliott10/pci-rs", rev = "8f33774b" }
virtio-drivers = { version = "0.7", optional = true }
lock = { path = "../lock" }
d1-pac = { version = "0.0.27", optional = true }
async-std = { version = "1.10", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
acpi = "4.1"
x2apic = "0.5"
x86_64 = "0.15"

[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
riscv = "0.9"
