[package]
name = "drivers"
version = "0.1.0"
edition = "2021"
description = "Boot-essential device drivers for zCore kernel"

[features]
# --- Driver features ---
# Each driver is gated by its own feature. The target TOML's `drivers`
# list maps to these features via xtask's driver_to_feature().

# Interrupt controllers
apic = ["dep:acpi", "dep:x2apic", "dep:x86_64"]
gic-400 = []
riscv-plic = ["dep:riscv"]
riscv-intc = ["dep:riscv"]

# UART serial drivers
pl011-uart = []
uart-16550 = []

# Keyboard input
ps2-keyboard = ["dep:pc-keyboard", "dep:x86_64"]

# Block / bus
virtio = ["dep:virtio-drivers"]
pci = []

# Special hardware UART drivers
allwinner = ["dep:d1-pac"]
fu740 = []

# Mock UART (reads host stdin, writes host stderr -- requires std)
mock-uart = ["dep:async-std"]

# LibOS mode (host std support)
libos = ["dep:async-std"]

# Legacy (dead code, kept for cfg compatibility)
board_malta = []

[dependencies]
hal = { path = "../hal" }
log = "0.4"
cfg-if = "1.0"
bitflags = "1.3"
spin = "0.9"
device_tree = { git = "https://github.com/rcore-os/device_tree-rs", rev = "2f2e55f" }
bitmap-allocator = "0.4"
pci = { git = "https://github.com/elliott10/pci-rs", rev = "8f33774b" }
lock = { path = "../lock" }

# Optional dependencies (pulled in by driver features)
virtio-drivers = { version = "0.7", optional = true }
d1-pac = { version = "0.0.27", optional = true }
async-std = { version = "1.10", optional = true }
acpi = { version = "4.1", optional = true }
x2apic = { version = "0.5", optional = true }
x86_64 = { version = "0.15", optional = true }
pc-keyboard = { version = "0.9", optional = true }
riscv = { version = "0.9", optional = true }
