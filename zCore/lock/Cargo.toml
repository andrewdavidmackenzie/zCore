[package]
name = "lock"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["ticket"]
ticket = ["spin/use_ticket_mutex"]
# Enable runtime lock ordering checks and spin-timeout deadlock
# detection. Adds overhead to every lock/unlock call. Enable for
# debugging; disable for production/CI.
lockdep = []

[dependencies]
cfg-if = "1.0.0"
log = "0.4"

# Bare-metal mode on x86_64
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

# Bare-metal mode on riscv64
[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = { git = "https://github.com/rust-embedded/riscv", rev = "cd31989ba1", features = ["inline-asm"] }

# Bare-metal mode on aarch64
[target.'cfg(target_arch = "aarch64")'.dependencies]
tock-registers = "0.7"
cortex-a = "7.2.0"

# LibOS mode
[target.'cfg(not(target_os = "none"))'.dependencies]
spin = "0.9"
