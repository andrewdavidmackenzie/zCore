[package]
name = "linux-syscall"
version = "0.1.0"
authors = ["Runji Wang <wangrunji0408@163.com>"]
edition = "2021"
description = "Linux syscalls implementation"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.cargo-all-features]
# Depends on hal-impl (default-features = false) with no libos feature
# of its own. Cannot compile on the host standalone.
skip_package = true

[dependencies]
hal = { path = "../hal" }
log = "0.4"
bitflags = "1.3"
numeric-enum-macro = "0.2"
static_assertions = "1.1.0"
zircon-object = { path = "../zircon-object" }
linux-object = { path = "../linux-object" }
hal-impl = { path = "../hal-impl", default-features = false }
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
bitvec = { version = "0.22", default-features = false, features = ["alloc"] }
lock = { path = "../lock" }
futures = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await",
] }

[dev-dependencies]
async-std = { version = "1.10", features = ["unstable"] }
