[package]
name = "hal-impl"
version = "0.1.0"
authors = [
  "Runji Wang <wangrunji0408@163.com>",
  "Yuekai Jia <equation618@gmail.com>",
]
edition = "2021"
description = "HAL implementation -- platform-specific backends for the hal crate"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["libos"]
libos = [
  "nix",
  "tempfile",
  "async-std",
  "bitmap-allocator",
  "drivers/libos",
]
board-c910light = []
board-fu740 = []
board-raspi400 = []
link-user-img = []
# Enable extra page table flags for T-Head CPU with MAEE on
thead-maee = []

# --- Driver features (forwarded to drivers) ---
apic = ["drivers/apic"]
gic-400 = ["drivers/gic-400"]
riscv-plic = ["drivers/riscv-plic"]
riscv-intc = ["drivers/riscv-intc"]
pl011-uart = ["drivers/pl011-uart"]
uart-16550 = ["drivers/uart-16550"]
ps2-keyboard = ["drivers/ps2-keyboard"]
virtio = ["drivers/virtio"]
mock-uart = ["drivers/mock-uart"]
pci = ["drivers/pci"]
allwinner-drivers = ["drivers/allwinner"]
fu740-drivers = ["drivers/fu740"]

# --- Boot mode ---
# When set, the kernel is linked for UEFI boot (different link address,
# no boot assembly). The UEFI stub handles page tables and MMU setup.
uefi-boot = []

[package.metadata.cargo-all-features]
# Bare-metal paths require custom target specs. Only the libos
# (default) feature set compiles on the host.
skip_package = true

[dependencies]
hal = { path = "../hal" }
log = "0.4"
spin = "0.9"
cfg-if = "1.0"
bitflags = "1.3"
trapframe = "0.11"
git-version = "0.3"
drivers = { path = "../drivers", features = ["virtio"] }
lock = { path = "../lock" }
nix = { version = "0.23", optional = true }
tempfile = { version = "3", optional = true }
async-std = { version = "1.10", optional = true }
bitmap-allocator = { version = "0.4", optional = true }

# Bare-metal mode
[target.'cfg(target_os = "none")'.dependencies]
naive-timer = "0.2.0"
executor = { path = "../executor" }
# Frame/heap allocators (moved from kernel)
customizable-buddy = "0.0.3"
bitmap-allocator = "0.4"
buddy_system_allocator = "0.8"

# For riscv
[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
riscv = "0.9"
sbi-rt = { version = "0.0.4", features = ["legacy"] }
dtb-walker = "=0.2.0-alpha.3"
r0 = "1.0"
page-table = "0.0.6"

# For x86_64
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86 = "0.52"
x86_64 = "0.15"

# For aarch64
[target.'cfg(target_arch = "aarch64")'.dependencies]
tock-registers = "0.7"
cortex-a = "7.2.0"

# Bare-metal mode on aarch64
[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
dtb-walker = "=0.2.0-alpha.3"

# Bare-metal mode on x86_64
[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"
x2apic = "0.5"
acpi = "4.1"
bootloader_api = "0.11"
