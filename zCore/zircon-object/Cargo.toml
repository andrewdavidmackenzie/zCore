[package]
name = "zircon-object"
version = "0.1.0"
authors = [
    "Runji Wang <wangrunji0408@163.com>",
    "Qinglin Pan <panqinglin00@163.com>",
]
edition = "2021"
description = "Zircon kernel objects"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
aspace-separate = []
dynamic-linking = ["elf"]
elf = ["xmas-elf"]
linux = []
#hypervisor = ["rvm"]
hypervisor = []
## Expose test-only constructors (e.g., CurrentThread::new_for_test).
testing = []

libos = [
    "hal-impl/libos",
]

[package.metadata.cargo-all-features]
# hal-impl needs libos to compile on the host.
always_include_features = ["libos"]
# hypervisor feature is a stub (rvm dependency is commented out). Broken.
# TODO: fix or remove hypervisor feature, then remove from denylist.
denylist = ["hypervisor"]

# Opt this crate into formal verification (#833): `make verify` runs
# cargo-verus on it. Dependencies are compiled with normal rustc and
# treated as trusted external crates; only this crate's `verus!` blocks
# are verified.
[package.metadata.verus]
verify = true

[lints.rust]
# Ghost code (specs, proofs) is erased during normal compilation, so
# imports used only by it would trigger unused-import warnings in
# production builds. Verus sets the `verus_only` cfg during verification;
# gate ghost-only imports with it. See
# https://verus-lang.github.io/verus/guide/erasure.html
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[dependencies]
hal = { path = "../hal" }
bitflags = "1.3"
log = "0.4"
hashbrown = "0.9"
downcast-rs = { version = "1.2", default-features = false }
hal-impl = { path = "../hal-impl", default-features = false }
numeric-enum-macro = "0.2"
futures = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await",
] }
xmas-elf = { version = "0.7", optional = true }
spin = "0.9"
cfg-if = "1.0"
#rvm = { git = "https://github.com/rcore-os/RVM", rev = "382fc60", optional = true }
lock = { path = "../lock" }
zircon-abi = { path = "../zircon-abi", default-features = false, features = ["alloc"] }
# Formal verification support (#833). vstd provides the `verus!` macro,
# which erases spec/proof code under normal rustc — the annotated source
# compiles both ways (single source of truth: the verified code IS the
# shipped code). The version must match the Verus toolchain that
# `make setup` installs into .verus/.
vstd = "=0.0.0-2026-11-22-0344"

[dev-dependencies]
serial_test = "4"
