[package]
name = "zircon-loader"
version = "0.1.0"
edition = "2021"
description = "Zircon user program loader and runner."

[dependencies]
log = "0.4"
cfg-if = "1.0"
xmas-elf = "0.7"
kernel-hal = { path = "../../kernel-hal", default-features = false }
zircon-object = { path = "../zircon-object", features = ["elf"] }
zircon-syscall = { path = "../zircon-syscall" }
executor = { path = "../executor" }
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }

[features]
default = []
libos = ["kernel-hal/libos", "zircon-object/aspace-separate"]
