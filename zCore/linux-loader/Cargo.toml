[package]
name = "linux-loader"
version = "0.1.0"
edition = "2021"
description = "Linux user program loader and runner."

[dependencies]
hal = { path = "../hal" }
log = "0.4"
cfg-if = "1.0"
hal-impl = { path = "../hal-impl", default-features = false }
zircon-object = { path = "../zircon-object", features = ["elf"] }
linux-object = { path = "../linux-object" }
linux-syscall = { path = "../linux-syscall" }
executor = { path = "../executor" }

[features]
default = []
libos = ["hal-impl/libos", "zircon-object/aspace-separate", "zircon-object/libos", "linux-object/libos"]

[package.metadata.cargo-all-features]
# hal-impl needs libos to compile on the host.
always_include_features = ["libos"]
