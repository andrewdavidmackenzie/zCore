[package]
name = "zircon-syscall"
version = "0.1.0"
authors = ["Runji Wang <wangrunji0408@163.com>"]
edition = "2021"
description = "Zircon syscalls implementation"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# hypervisor = ["zircon-object/hypervisor"]
deny-page-fault = []

[package.metadata.cargo-all-features]
# Depends on hal-impl (default-features = false) with no libos feature
# of its own. Cannot compile on the host standalone.
skip_package = true

[dependencies]
hal = { path = "../hal" }
log = "0.4"
bitflags = "1.3"
numeric-enum-macro = "0.2"
zircon-object = { path = "../zircon-object" }
hal-impl = { path = "../hal-impl", default-features = false }
futures = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await",
] }
cfg-if = "1.0"
lock = { path = "../lock" }
