[package]
name = "userstart"
version = "0.1.0"
edition = "2021"
description = "First userspace process for zCore Zircon mode"

[[bin]]
name = "userstart"
path = "src/main.rs"

[dependencies]
zircon-abi = { path = "../zircon-abi", features = ["userspace"] }

# Profile settings are in the workspace root Cargo.toml
