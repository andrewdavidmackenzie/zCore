[package]
name = "zcore"
version = "0.1.0"
authors = ["PanQL <panqinglin00@163.com>", "Yuekai Jia <equation618@gmail.com>"]
edition = "2021"


default-run = "zcore"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# Disable cargo test, bench and doc for this package
name = "zcore"
test = false
bench = false
doc = false

[features]
# Print colorless logs
colorless-log = []
thead-maee = ["kernel-hal/thead-maee"]
link-user-img = []
baremetal-test = ["executor/baremetal-test"]
mock-disk = ["linux-object/mock-disk"]

# --- Personality ---
zircon = ["zircon-loader", "rcore-fs", "rcore-fs-sfs"]
linux = ["linux-loader", "linux-object", "rcore-fs", "rcore-fs-sfs"]
libos = [
  "kernel-hal/libos",
  "linux-loader?/libos",
  "async-std",
  "chrono",
  "rcore-fs-hostfs",
]

# --- Driver features (forwarded to kernel-hal -> kernel-drivers) ---
apic = ["kernel-hal/apic"]
gic-400 = ["kernel-hal/gic-400"]
riscv-plic = ["kernel-hal/riscv-plic"]
riscv-intc = ["kernel-hal/riscv-intc"]
pl011-uart = ["kernel-hal/pl011-uart"]
uart-16550 = ["kernel-hal/uart-16550"]
ps2-keyboard = ["kernel-hal/ps2-keyboard"]
mock-uart = ["kernel-hal/mock-uart"]
virtio = ["kernel-hal/virtio"]
pci = ["kernel-hal/pci"]
allwinner-drivers = ["kernel-hal/allwinner-drivers"]
fu740-drivers = ["kernel-hal/fu740-drivers"]

# --- Board presets (combine personality + drivers + board-specific flags) ---
board-d1 = ["link-user-img", "allwinner-drivers"]
board-c910light = ["link-user-img", "kernel-hal/board-c910light"]
board-fu740 = ["link-user-img", "fu740-drivers"]
board-raspi400 = ["kernel-hal/board-raspi400"]

[dependencies]
log = "0.4"
cfg-if = "1.0"
spin = "0.9.4"
kernel-hal = { path = "../../kernel-hal", default-features = false }
zircon-object = { path = "../zircon-object" }
zircon-loader = { path = "../zircon-loader", optional = true }
linux-loader = { path = "../linux-loader", optional = true }
linux-object = { path = "../linux-object", optional = true }

lock = { path = "../lock" }
executor = { path = "../executor" }
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b", optional = true }
rcore-fs-sfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b", optional = true }

# LibOS mode
[target.'cfg(not(target_os = "none"))'.dependencies]
async-std = { version = "1.10", optional = true }
chrono = { version = "0.4", optional = true }
bitmap-allocator = "0.4"
rcore-fs-hostfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b", optional = true }

# RISC-V
[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
r0 = "1"
riscv = "0.9"
dtb-walker = "=0.2.0-alpha.3"
page-table = "0.0.6"
sbi-rt = { version = "0.0.2", features = ["legacy"] }
customizable-buddy = "0.0.3"

# Bare-metal mode on aarch64
# rayboot dependency removed — using direct kernel boot with QEMU -kernel
# See issue #2 for details on the migration from UEFI/rayboot to direct boot
[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
customizable-buddy = "0.0.3"

# Bare-metal mode on x86_64
[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
bitmap-allocator = "0.4"
buddy_system_allocator = "0.8"
bootloader_api = "0.11"
# rvm = { git = "https://github.com/rcore-os/RVM", rev = "e91d625", optional = true }
