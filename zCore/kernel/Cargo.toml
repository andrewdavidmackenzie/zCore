[package]
name = "kernel"
version = "0.1.0"
authors = ["PanQL <panqinglin00@163.com>", "Yuekai Jia <equation618@gmail.com>"]
edition = "2021"

default-run = "kernel"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# Disable cargo test, bench and doc for this package
name = "kernel"
test = false
bench = false
doc = false

[features]
# Print colorless logs
colorless-log = []
thead-maee = ["hal-impl/thead-maee"]
baremetal-test = ["executor/baremetal-test"]
sched-priority = ["executor/sched-priority"]

# --- Flavour ---
# Zircon is the base flavour (always enabled).
# Linux is additive — adds Linux syscall emulation on top of Zircon.
linux = ["linux-loader", "linux-object", "zircon-object/linux", "nix", "rcore-fs/std"]
# Dynamic linking — enables Fuchsia-style dynamic linking via ld.so.1.
# Needed for running dynamically-linked binaries like core-tests-standalone.
# Without this, all binaries are treated as statically linked.
dynamic-linking = ["zircon-loader/dynamic-linking"]
libos = [
  "hal-impl/libos",
  "linux-loader?/libos",
  "async-std",
  "chrono",
]

# --- Driver features (forwarded to hal-impl -> drivers) ---
# These are pure pass-throughs: the kernel code never checks these features
# via cfg!(). They exist because the kernel is the top-level cargo build
# target and Cargo requires features to be declared on the target package
# for --features to work. The actual code lives in hal-impl/drivers.
apic = ["hal-impl/apic"]
gic-400 = ["hal-impl/gic-400"]
gic-v3 = ["hal-impl/gic-v3"]
riscv-plic = ["hal-impl/riscv-plic"]
riscv-intc = ["hal-impl/riscv-intc"]
pl011-uart = ["hal-impl/pl011-uart"]
uart-16550 = ["hal-impl/uart-16550"]
ps2-keyboard = ["hal-impl/ps2-keyboard"]
fb-console = ["hal-impl/fb-console"]
mock-uart = ["hal-impl/mock-uart"]
virtio = ["hal-impl/virtio"]
pci = ["hal-impl/pci"]
uefi-boot = ["hal-impl/uefi-boot"]
allwinner-drivers = ["hal-impl/allwinner-drivers"]
fu740-drivers = ["hal-impl/fu740-drivers"]

# --- Board presets (forwarded to hal-impl) ---
# Same pass-through pattern as driver features. Target TOMLs specify
# these on the kernel package; the kernel forwards them to hal-impl
# where the board-specific code lives.
board-jollac2 = ["hal-impl/board-jollac2"]
board-raspi400 = ["hal-impl/board-raspi400"]

[dependencies]
log = "0.4"
cfg-if = "1.0"
spin = "0.9.4"
hal-impl = { path = "../hal-impl", default-features = false }
zircon-object = { path = "../zircon-object" }
zircon-loader = { path = "../zircon-loader" }
linux-loader = { path = "../linux-loader", optional = true }
linux-object = { path = "../linux-object", optional = true }

lock = { path = "../lock" }
executor = { path = "../executor" }
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
rcore-fs-sfs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }

# LibOS mode
[target.'cfg(not(target_os = "none"))'.dependencies]
async-std = { version = "1.10", optional = true }
chrono = { version = "0.4", optional = true }
nix = { version = "0.23", optional = true }

[package.metadata.cargo-all-features]
# Requires custom JSON target specs and -Z build-std; cannot be
# checked by cargo-all-features. Covered by xtask check-style.
skip_package = true

[lints.cargo]
# rcore-fs-sfs is used in bare-metal mode (both linux and zircon
# personalities) but the code is cfg'd out in libos mode. The cargo
# unused-deps lint cannot see through cfg gates.
unused_dependencies = "allow"
