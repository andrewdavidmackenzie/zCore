[package]
name = "x86-bootimage"
version = "0.1.0"
edition = "2021"
description = "Helper tool to create x86_64 bootable disk images"

[dependencies]
# Uses a local fork of the bootloader crate with a wcslen fix for UEFI.
# The fork is checked out as a git submodule at vendor/bootloader.
# See: https://github.com/rust-osdev/bootloader/issues/579
bootloader = { path = "../../vendor/bootloader", default-features = false, features = ["bios", "uefi"] }
anyhow = "1"
