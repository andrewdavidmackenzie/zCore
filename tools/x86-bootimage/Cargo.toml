[package]
name = "x86-bootimage"
version = "0.1.0"
edition = "2021"
description = "Helper tool to create x86_64 bootable disk images"

[dependencies]
# BIOS and UEFI boot support from crates.io.
# The wcslen fix (https://github.com/rust-osdev/bootloader/issues/579) is
# now in compiler_builtins (rust nightly 2026-09-15+).
bootloader = { version = "0.11", default-features = false, features = ["bios", "uefi"] }
anyhow = "1"
