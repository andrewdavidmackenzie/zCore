[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
authors = ["YdrMaster <ydrml@hotmail.com>"]
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zircon-abi = { path = "../../zCore/zircon-abi", features = ["zbi"] }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
toml = "0.5.9"
clap = { version = "4.0", features = ["derive"] }
dircpy = "0.3"
rand = "0.8"
once_cell = "1.15.0"
num_cpus = "1"
zcore-fs = { path = "../../zCore/vfs/zcore-fs", features = ["std"] }
zcore-sfs = { path = "../../zCore/vfs/zcore-sfs" }
os-xtask-utils = "0.0.0"

[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
shadow-rs = "0.11"

[target.'cfg(not(target_arch = "riscv64"))'.build-dependencies]
shadow-rs = "0.11"
