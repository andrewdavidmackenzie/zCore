[package]
name = "kernel-hal"
version = "0.1.0"
authors = [
  "Runji Wang <wangrunji0408@163.com>",
  "Yuekai Jia <equation618@gmail.com>",
]
edition = "2021"
description = "Kernel HAL interface definations."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["libos"]
libos = [
  "nix",
  "tempfile",
  "async-std",
  "bitmap-allocator",
  "kernel-drivers/libos",
]
board-c910light = []
link-user-img = []
# Enable extra page table falgs for T-Head CPU with MAEE on
thead-maee = []
# Disable PCI
no-pci = ["kernel-drivers/no-pci"]
# Enable allwinner drivers
allwinner-drivers = ["kernel-drivers/allwinner"]
# Enable fu740 drivers
fu740-drivers = ["kernel-drivers/fu740"]

[dependencies]
log = "0.4"
spin = "0.9"
cfg-if = "1.0"
bitflags = "1.3"
trapframe = "0.11"
git-version = "0.3"
numeric-enum-macro = "0.2"
kernel-drivers = { path = "../zCore/kernel-drivers", features = ["virtio"] }
lock = { path = "../zCore/lock" }
nix = { version = "0.23", optional = true }
tempfile = { version = "3", optional = true }
async-std = { version = "1.10", optional = true }
bitmap-allocator = { version = "0.4", optional = true }

# Bare-metal mode
[target.'cfg(target_os = "none")'.dependencies]
naive-timer = "0.2.0"
executor = { path = "../zCore/executor" }

# For riscv
[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
riscv = "0.9"
sbi-rt = { version = "0.0.2", features = ["legacy"] }

# For x86_64
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86 = "0.52"
x86_64 = "0.15"

# For aarch64
[target.'cfg(target_arch = "aarch64")'.dependencies]
tock-registers = "0.7"
cortex-a = "7.2.0"
dtb-walker = "=0.2.0-alpha.3"

# Bare-metal mode on x86_64
[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"
x2apic = "0.5"
acpi = "4.1"
