# QEMU x86_64 q35 machine -- Linux or Zircon
#
# Standard QEMU virtual machine with 16550 UART, APIC, PCI.
# Serial console provides both input and output in QEMU.

arch = "x86_64"
linker-script = "zCore/kernel/src/platform/x86/linker.ld"
drivers = ["uart-16550", "apic", "pci"]

[qemu]
machine = "q35"
cpu = "qemu64,+fsgsbase,+rdrand"
memory = "2G"

[rustc-target]
llvm-target = "x86_64-unknown-none-elf"
data-layout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"
features = "-mmx,-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2,+soft-float"
code-model = "kernel"
cpu = "x86-64"
max-atomic-width = 64
target-pointer-width = 64
target-endian = "little"
target-c-int-width = 32
disable-redzone = true
rustc-abi = "softfloat"
position-independent-executables = false
static-position-independent-executables = false
plt-by-default = false
relro-level = "full"
