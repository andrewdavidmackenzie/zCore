# Raspberry Pi 400 -- Zircon mode
#
# Real hardware: BCM2711 SoC, PL011 UART, GIC-400 (non-secure),
# no VirtIO, no PCI. Boots from SD card.

arch = "aarch64"
cores = 4
linker-script = "zCore/hal-impl/src/bare/arch/aarch64/platform/linker_raspi400.ld"
drivers = ["pl011-uart", "gic-400"]
features = ["board-raspi400"]

# No [qemu] section -- this is real hardware only.
# Use `make raspi400-run` for QEMU emulation with raspi4b machine.

[rustc-target]
llvm-target = "aarch64-unknown-linux-gnu"
data-layout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"
features = "+strict-align,+neon,+fp-armv8"
max-atomic-width = 128
relocation-model = "static"
target-pointer-width = 64
disable-redzone = true
