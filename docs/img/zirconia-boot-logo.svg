<svg width="500" height="190" viewBox="130 50 500 190" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Zirconia logo, horizontal</title>
<desc>A faceted, glassy tetragonal zircon crystal lying on its horizontal axis, fading from cool blue-white at the top-left to warm rust-orange at the bottom-right, above the wordmark ZIRCONIA and the tagline "Oxidized Zircon", on a dark slate background.</desc>
<defs>


  <filter id="oxideTexture" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="4" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="matrix"
      values="0 0 0 0 0.75
              0 0 0 0 0.35
              0 0 0 0 0.12
              0 0 0 0.9 0"/>
  </filter>

  <clipPath id="crystalClip">
    <polygon points="140,145 234,87 287,60 475,60 526,87 620,145 526,203 475,230 287,230 234,203"/>
  </clipPath>

  <radialGradient id="oxideFade" cx="72%" cy="55%" r="48%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <mask id="oxideMask">
    <rect x="0" y="0" width="760" height="420" fill="url(#oxideFade)"/>
  </mask>

  <linearGradient id="f1" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="45%" stop-color="#dff3ff"/>
    <stop offset="100%" stop-color="#9fd2ea"/>
  </linearGradient>
  <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e9f7ff"/>
    <stop offset="50%" stop-color="#bcdfec"/>
    <stop offset="100%" stop-color="#7fb2c4"/>
  </linearGradient>
  <linearGradient id="f3" x1="1" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#eaf7fb"/>
    <stop offset="55%" stop-color="#a9d3de"/>
    <stop offset="100%" stop-color="#6a99a4"/>
  </linearGradient>
  <linearGradient id="f4" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#cfe6e9"/>
    <stop offset="50%" stop-color="#93b3b8"/>
    <stop offset="100%" stop-color="#5c7478"/>
  </linearGradient>
  <linearGradient id="f5" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c9d6d3"/>
    <stop offset="45%" stop-color="#a3aa9f"/>
    <stop offset="100%" stop-color="#6f6a5a"/>
  </linearGradient>
  <linearGradient id="f6" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e3c6a8"/>
    <stop offset="45%" stop-color="#c9925c"/>
    <stop offset="100%" stop-color="#93531f"/>
  </linearGradient>
  <linearGradient id="f7" x1="1" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#f0c9a0"/>
    <stop offset="50%" stop-color="#d68d4f"/>
    <stop offset="100%" stop-color="#9a4b1c"/>
  </linearGradient>
  <linearGradient id="f8" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e8a877"/>
    <stop offset="45%" stop-color="#c8672f"/>
    <stop offset="100%" stop-color="#832d10"/>
  </linearGradient>
  <linearGradient id="f9" x1="1" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#d98a54"/>
    <stop offset="55%" stop-color="#a84d23"/>
    <stop offset="100%" stop-color="#5c220d"/>
  </linearGradient>
  <linearGradient id="f10" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#b35a2c"/>
    <stop offset="50%" stop-color="#823a19"/>
    <stop offset="100%" stop-color="#3f1608"/>
  </linearGradient>

  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
    <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>


</defs>



<g stroke="#0a0c10" stroke-width="1.2" stroke-linejoin="round">
  <polygon points="140,145 234,87 234,145" fill="url(#f1)"/>
  <polygon points="140,145 234,203 234,145" fill="url(#f2)"/>

  <polygon points="234,87 287,60 287,145 234,145" fill="url(#f3)"/>
  <polygon points="234,203 287,230 287,145 234,145" fill="url(#f4)"/>

  <polygon points="287,60 475,60 475,145 287,145" fill="url(#f5)"/>
  <polygon points="287,230 475,230 475,145 287,145" fill="url(#f6)"/>

  <polygon points="475,60 526,87 526,145 475,145" fill="url(#f7)"/>
  <polygon points="475,230 526,203 526,145 475,145" fill="url(#f8)"/>

  <polygon points="526,87 620,145 526,145" fill="url(#f9)"/>
  <polygon points="526,203 620,145 526,145" fill="url(#f10)"/>
</g>

<g clip-path="url(#crystalClip)">
  <g mask="url(#oxideMask)">
    <rect x="0" y="0" width="760" height="420" filter="url(#oxideTexture)" opacity="0.45"/>
  </g>
  <polygon points="140,145 234,87 287,60 475,60 526,87 620,145 526,203 475,230 287,230 234,203"
           fill="url(#gloss)"/>
</g>

<g stroke="#ffffff" stroke-linecap="round" fill="none" clip-path="url(#crystalClip)">
  <line x1="140" y1="145" x2="620" y2="145" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="255" y1="72" x2="330" y2="63" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="165" y1="120" x2="205" y2="98" stroke-width="2.5" stroke-opacity="0.55"/>
  <line x1="345" y1="63" x2="420" y2="63" stroke-width="1.5" stroke-opacity="0.4"/>
</g>

<polygon points="140,145 234,87 287,60 475,60 526,87 620,145 526,203 475,230 287,230 234,203"
         fill="none" stroke="#050607" stroke-width="2"/>




</svg>
