# QEMU x86_64 q35 machine
#
# Standard QEMU virtual machine with 16550 UART, APIC, PCI.
# Serial console provides both input and output in QEMU.
# Boots via UEFI (OVMF) firmware, same as real x86 hardware.
#
# `dynamic-linking` (vDSO support for prebuilt shared-lib binaries) is
# kept on this board: it is currently only enabled for the QEMU x86_64
# board (not x86-laptop) and is required by the prebuilt Fuchsia test
# binaries used with the core-tests product.

arch = "x86_64"
cores = 8
linker-script = "zCore/hal-impl/src/bare/arch/x86_64/platform/linker.ld"
drivers = ["uart-16550", "apic", "pci"]
features = ["dynamic-linking"]
boot-method = "uefi"
default-product = "busybox"

[qemu]
machine = "q35"
cpu = "qemu64,+rdrand,+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+cx16"
memory = "2G"

[rustc-target]
llvm-target = "x86_64-unknown-none-elf"
data-layout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"
features = "-mmx,-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2,+soft-float"
code-model = "kernel"
cpu = "x86-64"
max-atomic-width = 64
target-pointer-width = 64
target-endian = "little"
target-c-int-width = 32
disable-redzone = true
rustc-abi = "softfloat"
position-independent-executables = false
static-position-independent-executables = false
plt-by-default = false
relro-level = "full"
