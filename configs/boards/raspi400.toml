# Raspberry Pi 400 -- UEFI boot via pftf/RPi4 firmware
#
# Real hardware: BCM2711 SoC, PL011 UART, GIC-400 (non-secure),
# no VirtIO, no PCI.
#
# Uses EDK2 UEFI firmware (https://github.com/pftf/RPi4) to provide
# a standard UEFI boot environment. The kernel is loaded by the UEFI
# stub from the ESP partition on the SD card, and is linked at
# 0x80200000 (same as QEMU UEFI), in the Pi 400's 4GB RAM range.
#
# This is the only board configuration verified on real hardware
# (see docs/hw-test-log.md); the legacy raw/extlinux boot path was
# removed when the raspi400 and raspi400-uefi boards were merged.
#
# Zircon-only products boot the petal shell from the ZBI embedded in
# the kernel image (the board ships no rootfs).

arch = "aarch64"
cores = 4
linker-script = "zCore/hal-impl/src/bare/arch/aarch64/platform/linker-uefi.ld"
drivers = ["pl011-uart", "gic-400"]
features = ["uefi-boot", "board-raspi400"]
stub-features = ["board-raspi400", "uefi-console"]
boot-method = "uefi"
flash-method = "sd"
default-product = "petal"

# No [qemu] section -- this is real hardware only. The QEMU raspi4b
# machine cannot boot the UEFI-linked kernel.

[rustc-target]
llvm-target = "aarch64-unknown-linux-gnu"
data-layout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"
features = "+strict-align,+neon,+fp-armv8"
max-atomic-width = 128
relocation-model = "static"
target-pointer-width = 64
disable-redzone = true
