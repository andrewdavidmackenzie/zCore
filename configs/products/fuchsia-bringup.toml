# fuchsia-bringup: boot Fuchsia's real userboot and the bringup
# userspace (component_manager + bootstrap components) on zCore.
#
# Userspace artifacts are imported from a Fuchsia build by
# `make fuchsia-import` into prebuilt/fuchsia/<arch>/ — the same
# prebuilt-binary pattern as the core-tests product. The kernel embeds
# them at build time:
#   USERSTART_ELF -> userboot.elf   (Fuchsia's first process)
#   PETAL_ZBI     -> fuchsia.zbi    (userboot unpacks its bootfs)
#   VDSO_BIN      -> vdso.elf       (the matching vDSO)
#
# NOTE: boots via the kernel-side userboot launcher (issue #523
# Phase C): the kernel loads Fuchsia's real userboot with the
# handles-only two-message bootstrap protocol and lets it
# self-relocate (the kernel does not apply userboot's relocations).
# Verified progress: userboot → component_manager (full dynamic
# library set via userboot's loader service) → root-component
# resolution. The `kernel.fuchsia-userboot=true` cmdline selects this
# path; it requires that USERSTART_ELF is Fuchsia's userboot (the
# xtask's `rootfs-contents = "fuchsia"` wiring guarantees the
# pairing — a zCore userstart ELF with this flag set would fail at
# the first bootstrap read).

flavour = ""
root-proc = "userboot"
log = "warn"
rootfs-contents = "fuchsia"
extra-cmdline = ["kernel.fuchsia-userboot=true"]

# The imported artifacts are x86_64 (built from bringup.x64-balanced).
supported-boards = ["qemu-x86_64"]
